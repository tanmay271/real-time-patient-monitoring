# Naming rule for every resource added by a later task: use Fn::Sub with the
# pattern patient-monitoring-{Env}-<thing>. No literal resource names.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Skeleton for the synthetic patient-monitoring application.

Parameters:
  Env:
    Type: String
    Description: Contributor's IAM username or demo.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "patient-monitoring-${Env}-frontend"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "patient-monitoring-${Env}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub patient-monitoring-${Env}-alerts
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: alert_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: alert_id
          AttributeType: S
        - AttributeName: patient_rule
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: patient_rule
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub patient-monitoring-${Env}-patients
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S

  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub patient-monitoring-${Env}-readings
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
        - AttributeName: reading_time
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: reading_time
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub patient-monitoring-${Env}-ingest-tables
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ReadingsTable.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt PatientsTable.Arn

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub patient-monitoring-${Env}-ingest
      CodeUri: ../src/
      Handler: ingest.handler.lambda_handler
      Role: !GetAtt IngestRole.Arn
      Environment:
        Variables:
          PATIENTS_TABLE: !Ref PatientsTable
          READINGS_TABLE: !Ref ReadingsTable

Outputs:
  FrontendDistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
    Description: CloudFront domain for the frontend - input to AUT-02 (Cognito callback URL) and API-07 (CORS origin)
