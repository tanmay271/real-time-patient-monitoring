# Naming rule for every resource added by a later task: use Fn::Sub with the
# pattern patient-monitoring-{Env}-<thing>. No literal resource names.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Skeleton for the synthetic patient-monitoring application.

Parameters:
  Env:
    Type: String
    Description: Contributor's IAM username or demo.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "patient-monitoring-${Env}-frontend"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "patient-monitoring-${Env}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub patient-monitoring-${Env}-patients
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S

  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub patient-monitoring-${Env}-readings
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: patient_id
          KeyType: HASH
        - AttributeName: reading_time
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: reading_time
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  FrontendDistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
    Description: CloudFront domain for the frontend - input to AUT-02 (Cognito callback URL) and API-07 (CORS origin)
