name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-template:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli
      - name: Validate template (lint only, no AWS credentials needed)
        run: sam validate --lint --template infra/template.yaml

  test-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          if [ -f simulator/requirements.txt ]; then pip install -r simulator/requirements.txt; fi
      - name: Run unit tests
        run: pytest tests/unit -v

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend package
        id: frontend-check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.frontend-check.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: frontend
      - run: npm run build
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: frontend

  no-secrets:
    name: Guard against committed identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for AWS account IDs and invoke URLs
        run: |
          set +e
          # 12-digit account IDs, API Gateway invoke URLs, Cognito pool IDs
          PATTERN='[0-9]{12}|execute-api\.[a-z0-9-]+\.amazonaws\.com|us-east-1_[A-Za-z0-9]{9}'
          HITS=$(grep -rInE "$PATTERN" \
                   --exclude-dir=.git \
                   --exclude-dir=node_modules \
                   --exclude='*.lock' \
                   --exclude='package-lock.json' \
                   --exclude='CODEOWNERS' \
                   . )
          if [ -n "$HITS" ]; then
            echo "::error::Possible AWS identifier committed:"
            echo "$HITS"
            exit 1
          fi
          echo "No AWS identifiers found."
